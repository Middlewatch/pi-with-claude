# CI runs exactly scripts/verify.sh after environment setup, so one
# local run reproduces CI. The pi version is pinned; bumps are
# deliberate commits, like the SDK pin.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm install -g @earendil-works/pi-coding-agent@0.84.4
      - run: scripts/verify.sh
